name: Release

# Releases are cut by pushing a semver tag, e.g.
#   git tag v1.2.3 && git push origin v1.2.3
#
# The tag glob below is deliberately loose -- GitHub tag filters cannot
# express semver -- so the first job step validates it strictly and fails
# fast on anything that is not vMAJOR.MINOR.PATCH[-prerelease][+build].
on:
  push:
    tags:
      - "v*"

# One release per tag; never cancel a run that may have already published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # gh release create

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tag
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Validate tag is semver
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Official semver.org regex, with a leading "v".
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'

          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::Tag '$TAG' is not a valid semver release tag. Expected vMAJOR.MINOR.PATCH[-prerelease][+build], e.g. v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

          version="${TAG#v}"

          # Strip build metadata before looking for a prerelease suffix, so
          # that v1.2.3+build-7 is not misread as a prerelease.
          if [[ "${version%%+*}" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (prerelease: $prerelease)"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle Cloudflare Worker
        run: npm run bundle:worker

      - name: Stage release artifact
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          name="joining-service-worker-${VERSION}.js"
          mkdir -p release
          cp build/worker-entry.js "release/${name}"
          ( cd release && sha256sum "${name}" > "${name}.sha256" )

          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "release/${name}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.artifact.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          assets=("release/${NAME}" "release/${NAME}.sha256")

          # Re-running a partially failed release should converge rather than
          # fail on "release already exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            args=(--title "$TAG" --generate-notes)
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${args[@]}" "${assets[@]}"
          fi
